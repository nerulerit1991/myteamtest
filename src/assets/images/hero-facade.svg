<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1814"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3326"/>
      <stop offset="0.5" stop-color="#211e18"/>
      <stop offset="1" stop-color="#14120f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6a15b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c6a15b" stop-opacity="0"/>
    </linearGradient>
    <pattern id="mullions" width="48" height="620" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="620" fill="#c6a15b" fill-opacity="0.28"/>
    </pattern>
    <pattern id="floors" width="1440" height="40" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1440" height="1" fill="#c6a15b" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1440" height="620" fill="url(#sky)"/>

  <!-- Main tower facade -->
  <polygon points="620,0 1440,0 1440,620 760,620" fill="url(#glass)"/>
  <polygon points="620,0 1440,0 1440,620 760,620" fill="url(#mullions)"/>
  <polygon points="620,0 1440,0 1440,620 760,620" fill="url(#floors)"/>

  <!-- Secondary tower -->
  <polygon points="980,60 1300,0 1300,620 1040,620" fill="#0f0e0c" fill-opacity="0.55"/>
  <polygon points="980,60 1300,0 1300,620 1040,620" fill="url(#mullions)" fill-opacity="0.6"/>

  <!-- Light wash -->
  <rect x="620" y="0" width="820" height="620" fill="url(#glow)"/>
  <line x1="620" y1="0" x2="760" y2="620" stroke="#c6a15b" stroke-opacity="0.5" stroke-width="2"/>
</svg>
